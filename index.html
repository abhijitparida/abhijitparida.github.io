<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhijit Parida</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        img {
            max-width: 90%;
            height: auto;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <img src="home.png" alt="Home" id="homeImage">
    <audio id="bgMusic" src="https://d3f0zak8fjp75d.cloudfront.net/lofi.mp3" loop></audio>

    <script>
        const homeImage = document.getElementById('homeImage');
        const bgMusic = document.getElementById('bgMusic');

        homeImage.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
            } else {
                bgMusic.pause();
            }
        });
    </script>
</body>

<!-- Music by kaveesha Senanayake from Pixabay -->

</html>
